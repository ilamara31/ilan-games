<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilan Games — Home</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ===================================================================
   SIX LOOKS, ONE LAYOUT.
   Everything below is driven by the tokens in each [data-look] block,
   so switching look changes nothing structural — only the paint.
   =================================================================== */
:root{
  --bg:#070c1c; --bg2:#0b1226; --panel:#111a35; --panel2:#16213f;
  --line:#22304f; --text:#eaf0ff; --mute:#93a3c8;
  --acc:#2f8fff; --acc2:#7c5cff; --gold:#ffc63d; --hot:#ff4d8d;
  --radius:16px; --radius-lg:22px;
  --shadow:0 18px 44px rgba(0,0,0,.5);
  --side:250px; --sheen:.16;
  --display:'Outfit','Trebuchet MS',sans-serif;
  --body:'Plus Jakarta Sans','Helvetica Neue',sans-serif;
}
/* 1 — Premium Cinematic (dark) */
[data-look="cinematic"]{
  --bg:#060b1a; --bg2:#0a1124; --panel:#101a36; --panel2:#152142;
  --line:#22314f; --text:#eef3ff; --mute:#94a4c9;
  --acc:#2f8fff; --acc2:#7c5cff; --gold:#ffc63d; --sheen:.16}
/* 2 — Clean & Modern (light) */
[data-look="clean"]{
  --bg:#eef3fb; --bg2:#ffffff; --panel:#ffffff; --panel2:#f5f8fe;
  --line:#dde5f3; --text:#101a2e; --mute:#6b7a96;
  --acc:#1f7aec; --acc2:#4f9bff; --gold:#f5a623; --hot:#e8447d;
  --shadow:0 12px 30px rgba(24,49,94,.1); --sheen:.05}
/* 3 — 3D & Colorful */
[data-look="colorful"]{
  --bg:#130a2e; --bg2:#1b0f3d; --panel:#231450; --panel2:#2c1a62;
  --line:#3b2480; --text:#f4efff; --mute:#a695d6;
  --acc:#ff9f1c; --acc2:#c65cff; --gold:#ffd84d; --hot:#ff4d8d; --sheen:.2}
/* 4 — Sleek Console */
[data-look="console"]{
  --bg:#04070f; --bg2:#070c18; --panel:#0b1322; --panel2:#0f1a2e;
  --line:#1a2942; --text:#e6eeff; --mute:#7f90b3;
  --acc:#00b2ff; --acc2:#0076ff; --gold:#ffc63d;
  --radius:12px; --radius-lg:14px; --sheen:.12}
/* 5 — Soft & Friendly */
[data-look="soft"]{
  --bg:#f7f5f0; --bg2:#ffffff; --panel:#ffffff; --panel2:#fbf9f5;
  --line:#e9e4da; --text:#2a2622; --mute:#857d72;
  --acc:#3d8b6f; --acc2:#6ab894; --gold:#e0a53c; --hot:#d9705f;
  --radius:20px; --radius-lg:26px;
  --shadow:0 12px 28px rgba(80,68,50,.09); --sheen:.04}
/* 6 — Futuristic & Bold */
[data-look="bold"]{
  --bg:#000308; --bg2:#03080f; --panel:#070f1c; --panel2:#0a1726;
  --line:#123049; --text:#e8fbff; --mute:#7aa3bd;
  --acc:#00e5ff; --acc2:#ff2bd1; --gold:#ffe14f;
  --radius:6px; --radius-lg:8px; --sheen:.24}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
svg.art{width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:3px;border-radius:8px}
.h{font-family:var(--display)}

/* ---------------- look switcher (the only thing not in your mockups) -- */
.looks{position:fixed;z-index:200;left:50%;transform:translateX(-50%);
  bottom:16px;display:flex;gap:5px;padding:6px;border-radius:999px;
  background:rgba(8,12,24,.86);backdrop-filter:blur(16px);
  border:1px solid rgba(160,190,255,.22);box-shadow:0 12px 34px rgba(0,0,0,.5);
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.looks button{font-size:12px;font-weight:700;color:#b9c8e8;padding:8px 13px;
  border-radius:999px;white-space:nowrap;transition:.15s}
.looks button:hover{color:#fff}
.looks button[aria-pressed="true"]{background:#fff;color:#0a1020}

/* ---------------- top bar ---------------- */
.top{position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:16px;
  padding:12px clamp(14px,2.4vw,26px);background:var(--bg2);
  border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.logo .pad{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none;
  box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 45%,transparent)}
.logo .pad svg{width:24px;height:24px}
.logo .name{font-family:var(--display);font-weight:800;font-size:19px;
  letter-spacing:.01em;line-height:1.1;display:flex;align-items:center;gap:6px}
.logo .name b{color:var(--acc)}
.logo .tag{font-size:10.5px;color:var(--mute);letter-spacing:.09em;font-weight:600}
.search{flex:1;max-width:400px;margin-left:clamp(6px,2vw,24px);position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:11px 16px 11px 42px;font-size:14px;
  font-family:inherit;outline:none;transition:.16s}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.bell{width:40px;height:40px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);display:grid;place-items:center;position:relative}
.bell svg{width:18px;height:18px;stroke:var(--text);fill:none;stroke-width:1.9}
.bell i{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;
  background:var(--hot);border:2px solid var(--panel)}
.me{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;
  border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.me .av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none;
  border:2px solid var(--gold)}
.me span{font-size:14px;font-weight:700}
.me .crown{color:var(--gold);font-size:11px}

/* ---------------- shell ---------------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);
  gap:clamp(14px,2vw,22px);padding:clamp(14px,2vw,22px) clamp(14px,2.4vw,26px) 96px;
  align-items:start}

/* ---------------- sidebar ---------------- */
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:14px}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:10px;display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:13px;padding:13px 15px;
  border-radius:var(--radius);font-size:14.5px;font-weight:600;color:var(--mute);
  text-decoration:none;transition:.16s}
.nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none}
.nav a:hover{color:var(--text);background:var(--panel2)}
.nav a.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 40%,transparent)}
[data-look="soft"] .nav a.on,[data-look="clean"] .nav a.on{color:#fff}

/* player card */
.player{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:16px}
.player .who{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.player .av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;
  border:2px solid var(--gold)}
.player .nm{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2}
.player .lv{font-size:12px;color:var(--mute);font-weight:600}
.bar{height:9px;border-radius:999px;background:var(--panel2);overflow:hidden;
  border:1px solid var(--line)}
.bar i{display:block;height:100%;width:87.6%;border-radius:999px;
  background:linear-gradient(90deg,var(--acc),var(--acc2))}
.xp{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;
  color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------------- hero ---------------- */
.hero{position:relative;border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow);
  min-height:clamp(220px,31vw,330px);display:flex;align-items:center;
  margin-bottom:clamp(20px,2.6vw,30px)}
.hero .bg{position:absolute;inset:0}
.hero .bg .lay{position:absolute;inset:-6%;
  transition:transform .55s cubic-bezier(.2,.8,.3,1)}
.hero .scrim{position:absolute;inset:0;
  background:linear-gradient(95deg,var(--panel) 2%,color-mix(in srgb,var(--panel) 74%,transparent) 38%,transparent 72%)}
.hero .in{position:relative;z-index:2;padding:clamp(20px,3vw,40px);max-width:60%}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:#3a2600;background:var(--gold);
  padding:6px 13px;border-radius:999px;margin-bottom:13px}
.hero h1{font-family:var(--display);font-weight:900;
  font-size:clamp(26px,4.6vw,50px);line-height:1;letter-spacing:-.02em;
  text-transform:uppercase;margin-bottom:9px;text-wrap:balance}
.hero p{font-size:clamp(13px,1.5vw,16px);color:var(--mute);font-weight:600;
  margin-bottom:clamp(14px,2vw,20px)}
.play{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);
  font-weight:800;font-size:clamp(14px,1.6vw,17px);color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  padding:12px 26px;border-radius:999px;
  box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 45%,transparent);
  transition:transform .15s,box-shadow .15s}
.play:hover{transform:translateY(-2px)}
.play svg{width:15px;height:15px;fill:#fff}
.dots{position:absolute;right:clamp(14px,2vw,22px);bottom:clamp(14px,2vw,20px);
  z-index:3;display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.34);
  cursor:pointer;transition:.2s}
.dots i.on{background:#fff;width:22px;border-radius:999px}

/* ---------------- sections ---------------- */
.sec{margin-bottom:clamp(20px,2.6vw,30px)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:clamp(17px,2vw,22px);
  display:flex;align-items:center;gap:9px}
.sec-h .all{margin-left:auto;font-size:13px;font-weight:700;color:var(--acc);
  display:flex;align-items:center;gap:6px}
.grid{display:grid;gap:clamp(11px,1.4vw,16px);
  grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}

/* ---------------- game card ---------------- */
.g{position:relative;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);background:var(--panel);text-align:left;
  transition:transform .26s cubic-bezier(.2,.8,.3,1),box-shadow .26s,border-color .26s;
  display:block;width:100%}
.g:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--acc)}
.g .shot{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--bg2)}
.g .shot .lay{position:absolute;inset:-7%;
  transition:transform .4s cubic-bezier(.2,.8,.3,1)}
.g:hover .shot .lay{transform:scale(1.11)}
.g .shot::after{content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,var(--panel) 3%,color-mix(in srgb,var(--panel) 45%,transparent) 36%,transparent 62%)}
.g .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:11px 12px 12px}
.g .cap h3{font-family:var(--display);font-weight:700;font-size:14.5px;line-height:1.2;
  margin-bottom:6px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.g .cap .kind{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;
  background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--text);
  border:1px solid color-mix(in srgb,var(--acc) 42%,transparent)}
.g .go{position:absolute;right:10px;bottom:11px;z-index:3;width:26px;height:26px;
  border-radius:50%;background:var(--acc);display:grid;place-items:center;
  opacity:0;transform:scale(.6);transition:.24s}
.g:hover .go{opacity:1;transform:scale(1)}
.g .go svg{width:11px;height:11px;fill:#fff}
.g .flag{position:absolute;top:9px;left:9px;z-index:3;font-size:9.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:999px;
  background:var(--hot);color:#fff}
.g .flag.new{background:var(--gold);color:#3a2600}

/* ---------------- user of the week ---------------- */
.uotw{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(12px,1.6vw,18px);
  margin-bottom:clamp(20px,2.6vw,30px)}
.crownbox{position:relative;overflow:hidden;border-radius:var(--radius-lg);
  border:1px solid color-mix(in srgb,var(--gold) 42%,var(--line));padding:clamp(16px,2vw,22px);
  background:linear-gradient(120deg,color-mix(in srgb,var(--gold) 16%,var(--panel)),var(--panel) 62%)}
.crownbox::after{content:'♛';position:absolute;right:-8px;bottom:-30px;font-size:130px;
  color:var(--gold);opacity:.1;line-height:1}
.crownbox .lbl{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.champ{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.champ .av{width:62px;height:62px;border-radius:50%;overflow:hidden;flex:none;
  border:3px solid var(--gold);box-shadow:0 6px 20px color-mix(in srgb,var(--gold) 40%,transparent)}
.champ .who{min-width:0}
.champ .nm{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.6vw,27px);
  line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.champ .sub2{font-size:13px;color:var(--mute);font-weight:600;margin-top:3px}
.champ .big{margin-left:auto;text-align:right;flex:none}
.champ .big b{display:block;font-family:var(--display);font-size:clamp(24px,3.4vw,36px);
  font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.champ .big span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
  font-weight:800}
.runners{border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--panel);
  padding:clamp(14px,1.8vw,18px)}
.runners .lbl{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mute);margin-bottom:10px}
.rrow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.rrow .pos{width:20px;font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}
.rrow .rn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rp{margin-left:auto;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}

/* ---------------- views ---------------- */
.vh{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.vh h2{font-weight:800;font-size:clamp(20px,2.6vw,28px)}
.vh span{font-size:13px;color:var(--mute);font-weight:600}

/* friends: faces first, big */
.people{display:grid;gap:clamp(12px,1.6vw,18px);
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.person{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px 14px;text-align:center;transition:.2s;width:100%}
.person:hover{transform:translateY(-5px);border-color:var(--acc);box-shadow:var(--shadow)}
.person .av{width:clamp(78px,11vw,102px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  margin:0 auto 12px;border:3px solid var(--line);background:var(--panel2)}
.person:hover .av{border-color:var(--acc)}
.person .nm{font-family:var(--display);font-weight:700;font-size:clamp(15px,1.8vw,18px);
  line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .st{font-size:11.5px;color:var(--mute);font-weight:600;margin-top:4px}
.person .st b{color:var(--acc)}

.groups{display:grid;gap:clamp(11px,1.5vw,15px);
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.grp{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;text-align:left;transition:.2s;width:100%}
.grp:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:var(--shadow)}
.grp .av{width:50px;height:50px;border-radius:15px;overflow:hidden;flex:none;display:grid;
  place-items:center;font-size:23px;background:var(--panel2);border:1px solid var(--line)}
.grp .nm{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .mt{font-size:12px;color:var(--mute);font-weight:600;margin-top:3px}

/* leaderboard */
.bpick{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;margin-bottom:6px;
  scrollbar-width:none}
.bpick::-webkit-scrollbar{display:none}
.bpick button{font-size:13px;font-weight:700;color:var(--mute);background:var(--panel);
  border:1px solid var(--line);padding:9px 15px;border-radius:999px;white-space:nowrap;
  transition:.16s}
.bpick button:hover{color:var(--text)}
.bpick button[aria-pressed="true"]{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--acc),var(--acc2))}
.btable{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
  overflow:hidden}
.brow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.top{background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 14%,transparent),transparent 62%)}
.brow .rk{font-family:var(--display);font-weight:900;font-size:17px;color:var(--mute);
  font-variant-numeric:tabular-nums}
.brow.top .rk{color:var(--gold);font-size:21px}
.brow .pn{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:9px}
.brow .pn .gm{font-size:11px;font-weight:700;color:var(--mute);padding:3px 8px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.brow .sc{font-family:var(--display);font-weight:800;font-size:16px;color:var(--acc);
  font-variant-numeric:tabular-nums}
.empty{padding:34px 18px;text-align:center;color:var(--mute);font-size:14px}

/* chat sheet */
.chat{position:fixed;inset:0;z-index:150;display:grid;place-items:end center;
  background:rgba(4,8,18,.66);backdrop-filter:blur(8px);padding:0}
.chat[hidden]{display:none}
.chat-in{width:min(560px,100%);max-height:84vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}
.chat-h .av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;
  border:2px solid var(--acc);display:grid;place-items:center;font-size:20px;background:var(--panel2)}
.chat-h .nm{font-weight:700;font-size:16.5px}
.chat-h .sub2{font-size:12px;color:var(--mute);font-weight:600;margin-top:2px}
.chat-h .x{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line);font-size:14px}
.chat-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;
  min-height:200px}
.msg{max-width:78%;padding:10px 14px;border-radius:15px;font-size:14px;line-height:1.5;
  background:var(--panel2);border:1px solid var(--line)}
.msg .who{font-size:11px;font-weight:800;color:var(--acc);margin-bottom:3px;
  letter-spacing:.05em}
.msg.mine{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#fff;border-color:transparent}
.chat-f{display:flex;gap:9px;padding:13px 15px;border-top:1px solid var(--line)}
.chat-f input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:12px 17px;font-size:14px;font-family:inherit;outline:none}
.chat-f input:focus{border-color:var(--acc)}
.send{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:800;
  padding:12px 21px;border-radius:999px;font-size:14px}

.navb{display:flex;align-items:center;gap:13px;padding:13px 15px;width:100%;text-align:left;
  border-radius:var(--radius);font-size:14.5px;font-weight:600;color:var(--mute);transition:.16s}
.navb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none}
.navb:hover{color:var(--text);background:var(--panel2)}
.navb.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 40%,transparent)}

@media (max-width:760px){
  .uotw{grid-template-columns:minmax(0,1fr)}
}

/* ---------------- bottom banner ---------------- */
.cta{position:relative;overflow:hidden;border-radius:var(--radius-lg);
  border:1px solid var(--line);padding:clamp(16px,2.4vw,26px) clamp(18px,2.6vw,30px);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(115deg,var(--acc),var(--acc2) 58%,var(--hot))}
.cta::after{content:'';position:absolute;inset:0;
  background:radial-gradient(70% 160% at 12% 0%,rgba(255,255,255,.28),transparent 60%)}
.cta .words{position:relative;z-index:2;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;font-family:var(--display);font-weight:900;color:#fff;
  font-size:clamp(15px,2.2vw,23px);letter-spacing:.04em;text-transform:uppercase}
.cta .words span{display:flex;align-items:center;gap:9px}
.cta .join{position:relative;z-index:2;margin-left:auto;background:#fff;color:#12203c;
  font-family:var(--display);font-weight:800;font-size:14.5px;padding:12px 24px;
  border-radius:999px;display:flex;align-items:center;gap:8px;white-space:nowrap}

/* ---------------- responsive ---------------- */
@media (max-width:1000px){
  :root{--side:0px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:2;flex-direction:row;flex-wrap:wrap}
  .nav{flex:1 1 100%;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:11px 14px}
  .player{flex:1 1 100%}
  .hero .in{max-width:100%}
  .hero .scrim{background:linear-gradient(0deg,var(--panel) 6%,color-mix(in srgb,var(--panel) 62%,transparent) 54%,transparent 88%)}
  .hero{align-items:flex-end;min-height:270px}
}
@media (max-width:640px){
  .logo .tag,.me span,.me .crown{display:none}
  .search{max-width:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(144px,1fr))}
  .cta .join{margin-left:0;width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
  "use strict";
  document.body.insertAdjacentHTML('afterbegin', ArcadeArt.defs);
  var G = window.GAMES, byId = {};
  G.forEach(function(g){ byId[g.id] = g; });

  /* ---- an avatar, drawn rather than fetched ---- */
  var AV = '<svg viewBox="0 0 48 48" style="width:100%;height:100%;display:block">' +
    '<rect width="48" height="48" fill="#2b3a63"/>' +
    '<circle cx="24" cy="19" r="9" fill="#f0c9a4"/>' +
    '<path d="M24 8a9 9 0 0 1 9 8c-3 1-6-1-9-1s-6 2-9 1a9 9 0 0 1 9-8z" fill="#31241a"/>' +
    '<path d="M8 48c1-10 8-15 16-15s15 5 16 15z" fill="#1f7aec"/></svg>';
  document.getElementById('av1').innerHTML = AV;
  document.getElementById('av2').innerHTML = AV;

  /* ---- rows, ordered by what people actually play ------------------------
   * PLAYS comes from the game_plays table, which analytics.js ticks after
   * 25 seconds of real, visible play. So "Popular" is literally the most
   * played, and "More games" is the tail — not a hand-picked list.
   */
  var PLAYS = {}, TOP = [];

  function ranked() {
    return G.slice().sort(function (a2, b2) {
      return (PLAYS[b2.id] || 0) - (PLAYS[a2.id] || 0);
    });
  }

  /* What this player reaches for. analytics.js leaves the folders they have
   * opened in ig_played, so their taste is already on the device: score every
   * game by how much its tags overlap what they play, and never recommend
   * something they already play constantly. */
  function forYou(pool) {
    var mine = [];
    try { mine = JSON.parse(localStorage.getItem('ig_played') || '[]'); } catch (e) {}
    var taste = {};
    mine.forEach(function (id) {
      var g = byId[id];
      if (g) g.t.forEach(function (t) { taste[t] = (taste[t] || 0) + 1; });
    });

    var haveTaste = Object.keys(taste).length > 0;
    return pool.slice().sort(function (x, y) {
      function score(g) {
        // With no history to go on, fall back to the crowd.
        if (!haveTaste) return (PLAYS[g.id] || 0) / 50;
        var s2 = 0;
        g.t.forEach(function (t) { s2 += (taste[t] || 0); });
        if (mine.indexOf(g.id) >= 0) s2 -= 3;      // they already know this one
        return s2 + (PLAYS[g.id] || 0) / 400;      // popularity as a tiebreak
      }
      return score(y) - score(x);
    });
  }

  function card(g){
    var flag = g.fresh ? '<span class="flag new">New</span>'
             : (g.t.indexOf('Live')>=0 ? '<span class="flag">Live</span>' : '');
    var n = PLAYS[g.id] || 0;
    return '<button class="g" data-id="'+g.id+'">'+
      '<div class="shot"><div class="lay">'+ArcadeArt.art(g.id)+'</div></div>'+
      flag +
      '<div class="cap"><h3>'+g.n+'</h3><span class="kind">'+
        (n ? n.toLocaleString() + ' plays' : g.t[0]) + '</span></div>'+
      '<span class="go"><svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg></span>'+
    '</button>';
  }

  function draw(filter){
    var q = (filter||'').trim().toLowerCase();
    var all = ranked();
    if (q) {
      var hits = all.filter(function(g){
        return g.n.toLowerCase().indexOf(q)>=0 || g.t.join(' ').toLowerCase().indexOf(q)>=0;
      });
      document.getElementById('rows').innerHTML = hits.length
        ? '<section class="sec"><div class="sec-h"><h2 class="h">🔍 Results</h2>'+
          '<span class="all">'+hits.length+' games</span></div>'+
          '<div class="grid">'+hits.map(card).join('')+'</div></section>'
        : '<section class="sec"><p style="color:var(--mute)">No game matches “'+filter+'”.</p></section>';
      wireCards(); return;
    }

    var popular = all.slice(0, 6);
    var rest    = all.slice(6);
    var picks   = forYou(rest).slice(0, 6);
    var chosen  = {};
    popular.concat(picks).forEach(function(g){ chosen[g.id] = 1; });

    var quick = all.filter(function(g){
      return !chosen[g.id] && g.p === '1' &&
             g.t.some(function(t){ return t==='Arcade' || t==='Skill'; });
    }).slice(0, 6);
    quick.forEach(function(g){ chosen[g.id] = 1; });

    // Everything left, quietest first — the tail of the catalogue.
    var more = all.filter(function(g){ return !chosen[g.id]; }).reverse();

    var out = '';
    function sec(ico, h, note, items){
      if (!items.length) return;
      out += '<section class="sec"><div class="sec-h"><h2 class="h">'+ico+' '+h+'</h2>'+
             '<span class="all">'+note+'</span></div>'+
             '<div class="grid">'+items.map(card).join('')+'</div></section>';
    }
    sec('🔥','Popular Games','Most played right now', popular);
    sec('⭐','Top Picks for You','Based on what you play', picks);
    sec('⚡','Quick Play','One run, one minute', quick);
    sec('🎮','More Games','Fewer plays — go find one', more);

    document.getElementById('rows').innerHTML = out;
    wireCards();
  }

  function wireCards(){
    document.querySelectorAll('.g').forEach(function(c){
      c.addEventListener('click', function(){ feature(c.getAttribute('data-id'), true); });
    });
  }

  /* ---- hero ---- */
  var SPOT = ['f1','cricket','timeduel','obby','drawrush'], hi = 0, timer;

  function feature(id, scroll){
    var g = byId[id] || byId[SPOT[hi]];
    document.getElementById('heroArt').innerHTML =
      '<div class="lay">'+ArcadeArt.art(g.id)+'</div>';
    document.getElementById('hName').textContent = g.n;
    document.getElementById('hKick').textContent = g.k;
    var s = SPOT.indexOf(g.id);
    document.querySelectorAll('.dots i').forEach(function(d,n){
      d.classList.toggle('on', n === (s<0 ? -1 : s));
    });
    if (scroll) window.scrollTo({ top:0, behavior:'smooth' });
  }

  document.getElementById('dots').innerHTML = SPOT.map(function(){ return '<i></i>'; }).join('');
  document.querySelectorAll('.dots i').forEach(function(d,n){
    d.addEventListener('click', function(){ hi=n; feature(SPOT[hi]); restart(); });
  });
  function next(){ hi = (hi+1)%SPOT.length; feature(SPOT[hi]); }
  function restart(){ clearInterval(timer); timer = setInterval(next, 6500); }

  document.getElementById('hPlay').addEventListener('click', function(){
    var b = this, was = b.innerHTML;
    b.textContent = 'Opens ' + document.getElementById('hName').textContent;
    setTimeout(function(){ b.innerHTML = was; }, 1500);
  });

  // The banner art drifts under the cursor.
  document.getElementById('hero').addEventListener('pointermove', function(e){
    var b = this.getBoundingClientRect();
    var x = (e.clientX-b.left)/b.width-.5, y = (e.clientY-b.top)/b.height-.5;
    var l = document.querySelector('#heroArt .lay');
    if (l) l.style.transform = 'translate3d('+(-x*24)+'px,'+(-y*16)+'px,0) scale(1.08)';
  }, { passive:true });

  /* ---- look switcher ---- */
  var LOOKS = [
    ['cinematic','1 · Cinematic'], ['clean','2 · Clean'], ['colorful','3 · Colorful'],
    ['console','4 · Console'], ['soft','5 · Soft'], ['bold','6 · Bold']
  ];
  document.getElementById('looks').innerHTML = LOOKS.map(function(l,i){
    return '<button data-l="'+l[0]+'" aria-pressed="'+(i===0)+'">'+l[1]+'</button>';
  }).join('');
  document.querySelectorAll('.looks button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.looks button').forEach(function(o){
        o.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      document.body.setAttribute('data-look', b.getAttribute('data-l'));
      try { localStorage.setItem('ig_look', b.getAttribute('data-l')); } catch(e){}
    });
  });
  try {
    var saved = localStorage.getItem('ig_look');
    if (saved) {
      var t = document.querySelector('.looks button[data-l="'+saved+'"]');
      if (t) t.click();
    }
  } catch(e){}

  document.getElementById('q').addEventListener('input', function(){ draw(this.value); });

  /* ======================= views ======================= */
  var VIEWS = ['home','friends','board'];
  function show(v){
    VIEWS.forEach(function(n){ document.getElementById('v-'+n).hidden = (n !== v); });
    document.querySelectorAll('.navb').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-view') === v);
    });
    if (v === 'friends') loadFriends();
    if (v === 'board') loadBoard();
    window.scrollTo({ top:0, behavior:'smooth' });
  }
  document.querySelectorAll('.navb').forEach(function(b){
    b.addEventListener('click', function(){ show(b.getAttribute('data-view')); });
  });

  /* ======================= user of the week =======================
   * Real rows from ig_weekly for the current week. The week turns over on
   * Friday night and is decided server-side. */
  function initials(n){
    return (n||'?').trim().split(/\s+/).slice(0,2)
      .map(function(w){ return w[0]; }).join('').toUpperCase();
  }
  var HUES = ['#2f8fff','#ff5f7e','#48c8ff','#a78bfa','#3dd68c','#ffb03a','#ff7ad1','#00c2a8'];
  function hue(n){
    var h = 0; for (var i=0;i<(n||'').length;i++) h = (h*31 + n.charCodeAt(i)) >>> 0;
    return HUES[h % HUES.length];
  }
  function face(name, url, emoji){
    if (url) return '<img src="'+url+'" alt="" style="width:100%;height:100%;object-fit:cover" loading="lazy">';
    if (emoji) return '<span style="font-size:1.6em">'+emoji+'</span>';
    var c = hue(name);
    return '<svg viewBox="0 0 64 64" style="width:100%;height:100%;display:block">'+
      '<rect width="64" height="64" fill="'+c+'"/>'+
      '<text x="32" y="41" text-anchor="middle" font-family="Outfit,sans-serif" '+
        'font-size="26" font-weight="800" fill="#fff" opacity=".95">'+initials(name)+'</text></svg>';
  }

  IGData.weekly().then(function(w){
    var box = document.getElementById('uotw');
    if (!w.rows.length){
      box.innerHTML = '<div class="crownbox"><div class="lbl">♛ User of the Week</div>'+
        '<div class="champ"><div class="who"><div class="nm">Nobody yet</div>'+
        '<div class="sub2">This week just started — play a game and it could be you.</div>'+
        '</div></div></div>';
      return;
    }
    var top = w.rows[0];
    box.innerHTML =
      '<div class="crownbox"><div class="lbl">♛ User of the Week</div>'+
        '<div class="champ">'+
          '<span class="av">'+face(top.user_name)+'</span>'+
          '<div class="who"><div class="nm">'+top.user_name+'</div>'+
            '<div class="sub2">Most games played since Friday</div></div>'+
          '<div class="big"><b>'+top.plays+'</b><span>plays</span></div>'+
        '</div></div>'+
      '<div class="runners"><div class="lbl">This week’s chasers</div>'+
        w.rows.slice(1,6).map(function(r,i){
          return '<div class="rrow"><span class="pos">'+(i+2)+'</span>'+
                 '<span class="rn">'+r.user_name+'</span>'+
                 '<span class="rp">'+r.plays+'</span></div>';
        }).join('') +
        (w.rows.length<2 ? '<div class="rrow"><span class="rn" style="color:var(--mute)">'+
          'No one else on the board yet.</span></div>' : '') +
      '</div>';
  });

  /* ======================= friends ======================= */
  var friendsDone = false;
  function loadFriends(){
    if (friendsDone) return; friendsDone = true;
    Promise.all([IGData.allFriendPairs(), IGData.profiles(),
                 IGData.groups(), IGData.groupMembers()])
    .then(function(r){
      var pairs = r[0]||[], profs = r[1]||[], grps = r[2]||[], mem = r[3]||[];
      var pby = {}; profs.forEach(function(p){ pby[p.user_key] = p; });

      // How many friends each person has — the most connected show first.
      var deg = {}, seen = {};
      pairs.forEach(function(p){
        deg[p.akey] = (deg[p.akey]||0)+1;
        if (!seen[p.akey]) seen[p.akey] = p.aname || p.akey;
        if (!seen[p.bkey]) seen[p.bkey] = p.bname || p.bkey;
      });
      var people = Object.keys(seen).map(function(k){
        var pr = pby[k] || {};
        return { key:k, name: pr.name || seen[k], n: deg[k]||0,
                 url: pr.avatar_url, emo: pr.avatar_emoji };
      }).sort(function(a2,b2){ return b2.n - a2.n; }).slice(0, 18);

      document.getElementById('fCount').textContent =
        people.length + ' players · tap anyone to chat';
      document.getElementById('people').innerHTML = people.map(function(p){
        return '<button class="person" data-k="'+p.key+'" data-n="'+p.name.replace(/"/g,'')+'">'+
          '<span class="av">'+face(p.name, p.url, p.emo)+'</span>'+
          '<div class="nm">'+p.name+'</div>'+
          '<div class="st"><b>'+p.n+'</b> friend'+(p.n===1?'':'s')+'</div></button>';
      }).join('') || '<div class="empty">No friends yet.</div>';

      var count = {};
      mem.forEach(function(m){ count[m.group_id] = (count[m.group_id]||0)+1; });
      document.getElementById('gCount').textContent = grps.length + ' chats';
      document.getElementById('groupList').innerHTML = grps.map(function(g){
        return '<button class="grp" data-g="'+g.id+'" data-n="'+(g.name||'').replace(/"/g,'')+'">'+
          '<span class="av">'+(g.avatar_url
            ? '<img src="'+g.avatar_url+'" alt="" style="width:100%;height:100%;object-fit:cover">'
            : (g.avatar_emoji || '👥'))+'</span>'+
          '<div style="min-width:0"><div class="nm">'+(g.name||'Group')+'</div>'+
          '<div class="mt">'+(count[g.id]||0)+' members · '+(g.owner_name||'')+'</div></div></button>';
      }).join('') || '<div class="empty">No groups yet.</div>';

      document.querySelectorAll('.person').forEach(function(el2){
        el2.addEventListener('click', function(){
          openChat(el2.getAttribute('data-n'), el2.querySelector('.av').innerHTML,
                   'Direct message', null);
        });
      });
      document.querySelectorAll('.grp').forEach(function(el2){
        el2.addEventListener('click', function(){
          openChat(el2.getAttribute('data-n'), el2.querySelector('.av').innerHTML,
                   'Group chat', +el2.getAttribute('data-g'));
        });
      });
    });
  }

  /* chat — real messages where the group has them */
  function openChat(name, avatar, sub, groupId){
    document.getElementById('chatName').textContent = name;
    document.getElementById('chatSub').textContent = sub;
    document.getElementById('chatAv').innerHTML = avatar;
    var body = document.getElementById('chatBody');
    body.innerHTML = '<div class="empty">Loading…</div>';
    document.getElementById('chat').hidden = false;

    IGData.messages(80).then(function(all){
      var rows = (all||[]).filter(function(m){
        return groupId == null ? false : m.group_id === groupId;
      }).reverse().slice(-14);
      body.innerHTML = rows.length
        ? rows.map(function(m){
            return '<div class="msg"><div class="who">'+(m.name||'?')+'</div>'+
                   (m.text||'').replace(/</g,'&lt;')+'</div>';
          }).join('')
        : '<div class="empty">No messages here yet.<br>Say something first.</div>';
      body.scrollTop = body.scrollHeight;
    });
  }
  document.getElementById('chatX').addEventListener('click', function(){
    document.getElementById('chat').hidden = true;
  });
  document.getElementById('chat').addEventListener('click', function(e){
    if (e.target === this) this.hidden = true;
  });
  function sendMsg(){
    var i = document.getElementById('chatIn'), t = i.value.trim();
    if (!t) return;
    var b = document.getElementById('chatBody');
    if (b.querySelector('.empty')) b.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'msg mine';
    d.textContent = t;
    b.appendChild(d); b.scrollTop = b.scrollHeight;
    i.value = '';
  }
  document.getElementById('chatSend').addEventListener('click', sendMsg);
  document.getElementById('chatIn').addEventListener('keydown', function(e){
    if (e.key === 'Enter') sendMsg();
  });

  /* ======================= leaderboard ======================= */
  var boardDone = false, SCORES = [];
  function loadBoard(){
    if (boardDone) return; boardDone = true;
    IGData.board(900).then(function(rows){
      SCORES = rows || [];
      var games = {};
      SCORES.forEach(function(r){ games[r.game] = (games[r.game]||0)+1; });
      var list = Object.keys(games).filter(function(g){ return byId[g] || g === 'stars'; })
        .sort(function(a2,b2){ return games[b2]-games[a2]; });

      document.getElementById('bNote').textContent =
        SCORES.length.toLocaleString() + ' scores across ' + list.length + ' games';
      document.getElementById('bPick').innerHTML =
        '<button aria-pressed="true" data-g="*">🏆 Best overall</button>' +
        list.map(function(g){
          return '<button data-g="'+g+'">'+(byId[g] ? byId[g].n : 'Stars')+'</button>';
        }).join('');
      document.querySelectorAll('#bPick button').forEach(function(b){
        b.addEventListener('click', function(){
          document.querySelectorAll('#bPick button').forEach(function(o){
            o.setAttribute('aria-pressed','false'); });
          b.setAttribute('aria-pressed','true');
          renderBoard(b.getAttribute('data-g'));
        });
      });
      renderBoard('*');
    });
  }

  function renderBoard(game){
    var rows;
    if (game === '*') {
      /* "Best overall" can't just sort raw scores — a Tycoon score runs to
         seven figures and a Stack score to two. Rank each player within each
         game instead, and award points for placing. */
      var byGame = {};
      SCORES.forEach(function(r){ (byGame[r.game] = byGame[r.game] || []).push(r); });
      var pts = {};
      Object.keys(byGame).forEach(function(g){
        byGame[g].sort(function(a2,b2){ return b2.score - a2.score; })
          .slice(0,10).forEach(function(r,i){
            var k = r.name;
            pts[k] = (pts[k]||0) + (10 - i);
          });
      });
      rows = Object.keys(pts).map(function(n){ return { name:n, score:pts[n], game:'points' }; })
        .sort(function(a2,b2){ return b2.score - a2.score; }).slice(0,20);
    } else {
      var best = {};
      SCORES.filter(function(r){ return r.game === game; }).forEach(function(r){
        if (!best[r.name] || r.score > best[r.name].score) best[r.name] = r;
      });
      rows = Object.keys(best).map(function(k){ return best[k]; })
        .sort(function(a2,b2){ return b2.score - a2.score; }).slice(0,20);
    }

    document.getElementById('bTable').innerHTML = rows.length ? rows.map(function(r,i){
      var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      return '<div class="brow'+(i<3?' top':'')+'">'+
        '<span class="rk">'+medal+'</span>'+
        '<span class="pn">'+face2(r.name)+r.name+
          (game==='*' ? '<span class="gm">across all games</span>' : '')+'</span>'+
        '<span class="sc">'+r.score.toLocaleString()+
          (game==='*' ? ' pts' : '')+'</span></div>';
    }).join('') : '<div class="empty">No scores here yet.</div>';
  }
  function face2(n){
    return '<span style="width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;'+
      'display:inline-block;vertical-align:middle">'+face(n)+'</span>';
  }

  /* ---- real play counts drive the whole home page ---- */
  IGData.plays().then(function(map){
    PLAYS = map;
    draw(document.getElementById('q').value || '');
  });

  feature(SPOT[0]); draw(''); restart();
})();
</script>
</body></html>
