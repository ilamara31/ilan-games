<title>Arcade Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  --night:#0b0622; --floor:#150c33; --pod:#1c1240; --line:#332161;
  --text:#f2ecff; --mute:#a294cc; --mag:#ff3d9a; --cyan:#2ee6ff; --lime:#c9f74a;
  --gold:#ffc94d;
  --display:'Fredoka','Trebuchet MS',sans-serif;
  --body:'DM Sans','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--night);color:var(--text);font-family:var(--body);
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
svg.art{width:100%;height:100%;display:block}
:focus-visible{outline:3px solid var(--cyan);outline-offset:4px;border-radius:10px}

/* ---- the room: a lit floor receding to a horizon ---- */
.room{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 92%, rgba(255,61,154,.22), transparent 60%),
    radial-gradient(90% 60% at 50% 10%, rgba(46,230,255,.13), transparent 62%),
    linear-gradient(180deg,#0b0622 0%,#160c36 58%,#0b0622 100%)}
.grid{position:absolute;left:50%;bottom:-34vh;width:250vw;height:110vh;
  transform:translateX(-50%) perspective(620px) rotateX(74deg);
  background-image:
    linear-gradient(to right, rgba(140,110,255,.22) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(140,110,255,.22) 1px, transparent 1px);
  background-size:76px 76px;
  mask-image:linear-gradient(to top, #000 4%, transparent 62%);
  -webkit-mask-image:linear-gradient(to top, #000 4%, transparent 62%);
  animation:drift 9s linear infinite}
@keyframes drift{to{background-position:0 76px}}
#dust{position:absolute;inset:0}

/* ---- page ---- */
.page{position:relative;z-index:1;padding:0 clamp(16px,4vw,48px) 90px}
header{padding:clamp(48px,8vw,96px) 0 clamp(26px,4vw,44px);text-align:center}
.kicker{font-family:var(--body);font-size:12.5px;font-weight:700;letter-spacing:.32em;
  text-transform:uppercase;color:var(--mag);margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(44px,10vw,92px);
  line-height:.98;letter-spacing:-.02em;text-wrap:balance;
  background:linear-gradient(104deg,var(--cyan),#c07bff 46%,var(--mag));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 30px rgba(255,61,154,.28))}
.lede{font-size:clamp(15px,2vw,18px);color:var(--mute);max-width:52ch;margin:16px auto 0;
  line-height:1.6;text-wrap:balance}

/* ---- filter pills ---- */
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:26px 0 8px}
.pills button{font-family:var(--body);font-size:13.5px;font-weight:700;color:var(--mute);
  background:rgba(255,255,255,.05);border:1.5px solid var(--line);padding:9px 18px;
  border-radius:999px;cursor:pointer;transition:.16s}
.pills button:hover{color:var(--text);border-color:var(--cyan)}
.pills button[aria-pressed="true"]{color:#12062a;background:var(--cyan);border-color:var(--cyan)}

/* ---- the stage: pods standing on the floor ---- */
.stage{max-width:1240px;margin:0 auto;perspective:1500px;perspective-origin:50% 30%}
.pods{display:grid;gap:clamp(20px,3vw,34px);
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
  transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.3,1);
  padding-top:14px}

.pod{position:relative;background:none;border:0;padding:0;font-family:inherit;
  text-align:left;cursor:pointer;transform-style:preserve-3d}
/* the shadow it casts on the floor — this is what makes it stand, not float */
.pod::after{content:'';position:absolute;left:12%;right:12%;bottom:-16px;height:22px;
  background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.72), transparent 72%);
  transform:translateZ(-1px);transition:.34s cubic-bezier(.2,.8,.3,1)}
.pod:hover::after,.pod:focus-visible::after{left:4%;right:4%;bottom:-30px;
  height:30px;opacity:.85}

.body{position:relative;border-radius:20px;overflow:hidden;background:var(--pod);
  border:1.5px solid var(--line);transform-style:preserve-3d;
  transition:transform .34s cubic-bezier(.2,.8,.3,1),border-color .34s,box-shadow .34s}
.pod:hover .body,.pod:focus-visible .body{
  transform:translateY(-16px) translateZ(60px) rotateX(5deg);
  border-color:var(--cyan);box-shadow:0 30px 60px rgba(0,0,0,.6)}

.scene{position:relative;aspect-ratio:1/1;overflow:hidden}
.scene .layer{position:absolute;inset:-8%;
  transition:transform .4s cubic-bezier(.2,.8,.3,1)}
.pod:hover .scene .layer{transform:scale(1.1)}
.scene::after{content:'';position:absolute;inset:0;
  background:linear-gradient(0deg,var(--pod) 2%,rgba(28,18,64,.34) 40%,transparent 66%)}
.rib{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
.rib b{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 9px;border-radius:999px;background:rgba(11,6,34,.78);
  backdrop-filter:blur(6px);color:var(--text)}
.rib b.live{background:var(--mag)}
.rib b.new{background:var(--lime);color:#1b2600}

.label{position:relative;padding:14px 16px 17px}
.label h3{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1;
  margin-bottom:5px}
.label p{font-size:13px;line-height:1.45;color:var(--mute);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* a pod you are holding opens a panel in front of itself */
.front{position:absolute;inset:0;border-radius:20px;padding:20px;display:flex;
  flex-direction:column;justify-content:flex-end;gap:11px;
  background:linear-gradient(0deg,rgba(11,6,34,.97) 32%,rgba(11,6,34,.55));
  opacity:0;transform:translateZ(1px);transition:opacity .28s;z-index:3}
.pod:hover .front,.pod:focus-visible .front{opacity:1}
.front p{font-size:13.5px;line-height:1.55;color:var(--text);opacity:.9}
.front .row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--mute);
  font-weight:600;letter-spacing:.05em}
.front .go{font-family:var(--display);font-size:16px;font-weight:600;color:#12062a;
  background:var(--cyan);border-radius:999px;padding:11px 20px;text-align:center;
  align-self:flex-start}
@media (hover:none){.front{display:none}}

footer{position:relative;z-index:1;text-align:center;color:var(--mute);font-size:13.5px;
  padding:40px 16px 0}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<div class="room">
  <div class="grid"></div>
  <canvas id="dust"></canvas>
</div>

<div class="page">
  <header>
    <div class="kicker">27 games · one arcade</div>
    <h1>Step onto the floor</h1>
    <p class="lede">Every game Ilan has built, standing in one room. Lean on one to
      see what it plays like.</p>
    <div class="pills" id="pills"></div>
  </header>

  <div class="stage">
    <div class="pods" id="pods"></div>
  </div>

  <footer>Design study — Arcade Floor</footer>
</div>

<script src="../games.js"></script>
<script src="../art.js"></script>
<script>
(function(){
  "use strict";
  document.body.insertAdjacentHTML('afterbegin', ArcadeArt.defs);
  var G = window.GAMES;

  function pod(g){
    var rib = '';
    if (g.fresh) rib += '<b class="new">New</b>';
    if (g.t.indexOf('Live')>=0) rib += '<b class="live">Live</b>';
    rib += '<b>'+g.p+'</b>';
    return '<button class="pod" data-id="'+g.id+'">'+
      '<div class="body">'+
        '<div class="scene"><div class="layer">'+ArcadeArt.art(g.id)+'</div></div>'+
        '<div class="rib">'+rib+'</div>'+
        '<div class="label"><h3>'+g.n+'</h3><p>'+g.k+'</p></div>'+
        '<div class="front">'+
          '<div class="row">'+g.t.join(' · ')+'</div>'+
          '<p>'+g.d+'</p>'+
          '<span class="go">Play ›</span>'+
        '</div>'+
      '</div></button>';
  }

  function render(list){
    document.getElementById('pods').innerHTML = list.map(pod).join('');
    document.querySelectorAll('.pod').forEach(function(p){
      p.addEventListener('click', function(){
        var b = p.querySelector('.go');
        if (!b) return;
        var was = b.textContent;
        b.textContent = 'Opens the game';
        setTimeout(function(){ b.textContent = was; }, 1400);
      });
    });
  }

  /* The whole stage leans with the cursor, so the pods read as objects in a
     room rather than tiles on a page. Small angles — past about 6 degrees the
     text starts to smear. */
  var pods = document.getElementById('pods');
  window.addEventListener('pointermove', function(e){
    var x = e.clientX / window.innerWidth - .5, y = e.clientY / window.innerHeight - .5;
    pods.style.transform = 'rotateY('+(x*5)+'deg) rotateX('+(-y*3.4)+'deg)';
  }, { passive:true });

  /* Filters */
  var CATS = ['Everything','Live','3D','Sports','Arcade','Puzzle','Creative'];
  document.getElementById('pills').innerHTML = CATS.map(function(c,i){
    return '<button aria-pressed="'+(i===0)+'">'+c+'</button>';
  }).join('');
  document.querySelectorAll('.pills button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.pills button').forEach(function(o){
        o.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true');
      var c = b.textContent;
      render(c==='Everything' ? G : G.filter(function(g){ return g.t.indexOf(c)>=0; }));
    });
  });

  /* Ambient dust — slow, sparse, and it stops for reduced-motion. */
  var cv = document.getElementById('dust'), cx = cv.getContext('2d'), bits = [], raf;
  function size(){
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
    cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  function seed(){
    bits = []; var n = Math.min(60, Math.round(innerWidth/22));
    for (var i=0;i<n;i++) bits.push({
      x:Math.random()*innerWidth, y:Math.random()*innerHeight,
      r:Math.random()*1.9+.5, s:Math.random()*.22+.06,
      a:Math.random()*.4+.12, h:Math.random()<.5 ? '46,230,255' : '255,61,154'
    });
  }
  function tick(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    bits.forEach(function(b){
      b.y -= b.s; if (b.y < -6){ b.y = innerHeight+6; b.x = Math.random()*innerWidth; }
      cx.beginPath(); cx.arc(b.x,b.y,b.r,0,6.284);
      cx.fillStyle = 'rgba('+b.h+','+b.a+')'; cx.fill();
    });
    raf = requestAnimationFrame(tick);
  }
  addEventListener('resize', function(){ size(); seed(); }, { passive:true });
  size(); seed();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) tick();

  render(G);
})();
</script>
