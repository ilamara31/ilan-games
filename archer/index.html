<style>
  :root, html[data-theme]{ --accent:#9b7cf6; --accent2:#4d6bf0; --icon1:#e0c3fc; --icon2:#8ec5fc; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{background:transparent;font-family:var(--ig-font);color:var(--ig-text)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  /* the menu sits on the light page — hide the duel scene behind it */
  body:has(#ov:not(.hidden)) canvas{visibility:hidden}
  .hidden{display:none !important}

  /* ===== ilan Games theme — game-local layout (menu + light sheets) ===== */
  .ag-screen{position:fixed;inset:0;z-index:20;display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);
    font-family:var(--ig-font);color:var(--ig-text);text-align:left;letter-spacing:-.01em;background:transparent}
  .ag-screen .ig-col{gap:16px}
  .ag-spacer{width:44px;height:44px;flex:none}
  .ag-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px}
  .ag-head h2{font:700 17px/1.2 var(--ig-font);letter-spacing:-.02em;color:var(--ig-text);margin:0}
  .ag-note{font-size:14px;line-height:1.45;color:var(--ig-text2);text-align:center;font-weight:500}
  .ag-note b{color:var(--ig-text)}
  .ig-iconbtn{border:1px solid var(--ig-line);padding:0;font-family:var(--ig-font)}
  .ig-mode,.ig-row,.ig-cta,.ig-sq,.ig-btn{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .ig-btn svg,.ig-row > svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ig-row .ig-val{font-size:15px;font-weight:600;color:var(--ig-text2);margin-left:auto}
  .ig-modes{grid-template-columns:repeat(var(--n,3),1fr)}
  .ag-tips{display:flex;flex-direction:column;gap:12px}
  .ag-tip{display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.35;color:var(--ig-text2);font-weight:500}
  .ag-tip b{color:var(--ig-text);font-weight:700}
  .ag-tip .ig-tile{width:32px;height:32px;border-radius:9px}
  .ag-tip .ig-tile svg{width:18px;height:18px}
  /* light sheet pop-ups (pause, game over…) over the game */
  .ag-scrim{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px 16px;overflow-y:auto;
    background:rgba(20,20,40,.25);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);font-family:var(--ig-font);color:var(--ig-text)}
  .ag-sheet{width:min(380px,100%);display:flex;flex-direction:column;align-items:stretch;gap:12px;text-align:center;margin:auto}
  .ag-sheet .ig-eyebrow{margin-bottom:-4px}
  .ag-sheet h2{font:800 28px/1.1 var(--ig-font);letter-spacing:-.035em;color:var(--ig-text);margin:0}
  .ag-big{font:900 64px/1 var(--ig-font);letter-spacing:-.03em;background:linear-gradient(160deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:2px 0}
  .ag-badge{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font:700 13px/1 var(--ig-font);color:#fff;background:linear-gradient(160deg,#34c759,#1f9d48)}
  .ag-btns{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .ag-btns .ig-btn{width:100%}
  .ag-btnrow{display:flex;gap:10px}.ag-btnrow .ig-btn{flex:1;padding:0 12px}
  .ig-sheet .ig-stats{background:rgba(118,118,128,.08);border-radius:18px;padding:12px 4px}
  @media (max-width:370px){ .ig-mode small{display:none} }
</style></head>
<body>
<canvas id="g"></canvas>
<div id="ov" class="ag-screen">
  <div class="ig-col">
    <div class="ig-topbar">
      <a class="ig-navback" href="../" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Games</span></a>
      <span class="ag-spacer"></span>
    </div>
    <div class="ig-hero">
      <div class="ig-appicon"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="o" cx="70" cy="50" r="27" fill="#fff"/><circle cx="70" cy="50" r="21" fill="#b3122f"/><circle cx="70" cy="50" r="14" fill="#fff"/><circle cx="70" cy="50" r="7" fill="#b3122f"/>
<path class="o" d="M58 76 L52 94 M82 76 L88 94" stroke="#22120a" stroke-width="4"/>
<path d="M30 50 L68 50" stroke="#22120a" stroke-width="5" stroke-linecap="round"/><path d="M30 50 L68 50" stroke="#a8692f" stroke-width="2.5" stroke-linecap="round"/>
<path class="o" d="M22 44 L34 50 L22 56 L26 50Z" fill="#169b62"/>
<path class="o" d="M14 10 Q36 40 14 90" fill="none" stroke="#22120a" stroke-width="8"/><path d="M14 10 Q36 40 14 90" fill="none" stroke="#a8692f" stroke-width="4"/>
<path d="M14 10 L14 90" stroke="#fff" stroke-width="1.5"/>
<path d="M8 28 L2 26 M8 70 L2 74" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/>
<path class="o" d="M70 50 l-6 -4 M70 50 l-6 4" stroke="#22120a" stroke-width="2"/></svg></div>
      <div class="ig-title">Archer Duel</div>
      <div class="ig-tagline" id="ovTag">Draw back, aim the arc, outlast every rival.</div>
    </div>
    <div class="ig-playrow">
      <button class="ig-cta" id="start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg><span><b>Play</b><small id="best">Level 1 · vs rivals</small></span></button>
    </div>
    <div class="ig-modes" style="--n:2">
      <button class="ig-mode" id="tutBtn"><span class="ig-tile" style="--tile:linear-gradient(160deg,#ffcf4a,#ff8a00)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><path d="M12 17.2h.01"/></svg></span><b>Tutorial</b><small>Learn with the coach</small></button>
      <button class="ig-mode" id="lbBtn" onclick="window.IGAuth&&IGAuth.showLeaderboard('archer','Archer Duel')"><span class="ig-tile" style="--tile:linear-gradient(160deg,#5ac8fa,#0a60ff)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8.5 20h7M10 17h4"/></svg></span><b>Leaderboard</b><small>Top archers</small></button>
    </div>
    <div class="ig-card ag-tips">
      <div class="ag-tip"><span class="ig-tile" style="--tile:linear-gradient(160deg,var(--accent),var(--accent2))"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5"/><path d="M19 5h-5M19 5v5"/><path d="M5 19v-4M5 19h4M8 16v-3.5M8 16h3.5"/></svg></span><span><b>Drag back</b> from your archer, then let go to fire.</span></div>
      <div class="ag-tip"><span class="ig-tile" style="--tile:linear-gradient(160deg,#ff7a59,#e0364f)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></span><span><b>Headshots</b> do double damage.</span></div>
      <div class="ag-tip"><span class="ig-tile" style="--tile:linear-gradient(160deg,#5ee28a,#11998e)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg></span><span>Shoot the <b>falling hearts</b> to heal.</span></div>
    </div>
    <div class="ig-list">
      <button class="ig-row" id="agLogin" onclick="window.IGAuth&&IGAuth.openAuth()"><span class="ig-tile" style="--tile:linear-gradient(160deg,#8e8e93,#636366)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4.2 4-6.2 7.5-6.2s6.5 2 7.5 6.2"/></svg></span><span class="ig-grow"><span id="agLoginTxt">Log in</span><small id="agLoginSub">Put your best level on the leaderboard</small></span></button>
    </div>
  </div>
</div>
<div id="over" class="ag-scrim hidden">
  <div class="ig-sheet ag-sheet">
    <div class="ig-eyebrow">Defeated</div>
    <div class="ag-big" id="overLv">Lv 1</div>
    <div class="ag-note" id="overSub">A rival got you.</div>
    <div class="ig-stats"><div><b id="overBest">0</b><span>Best level</span></div></div>
    <div class="ag-btns">
      <button class="ig-btn" id="again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5v4.5h-4.5"/></svg>Duel again</button>
      <button class="ig-btn secondary" id="overMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6.5 9.5V20h11V9.5"/></svg>Menu</button>
    </div>
  </div>
</div>
<script>
"use strict";
const cv=document.getElementById('g'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1,PW=0,X0=0;
/* PW/X0: logical duel band, capped at phone-ish width so shot distances and the
   pixel-space physics feel the same on desktop as on mobile; X0 centres it. */
let skyGrad=null;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);groundY=H*0.82;PW=Math.min(W,560);X0=(W-PW)/2;
  skyGrad=ctx.createLinearGradient(0,0,0,H);skyGrad.addColorStop(0,'#1d3a63');skyGrad.addColorStop(1,'#4a78b0');}
addEventListener('resize',()=>{resize();wakeLoop();});
const rand=(a,b)=>a+Math.random()*(b-a);
/* per-account save: each logged-in account keeps its own progress.
   The device's existing save is inherited once, by the primary (first) account. */
function acctKey(){try{var p=JSON.parse(localStorage.getItem('ig_player'));if(p&&p.name)return p.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40);}catch(e){}try{var s=JSON.parse(localStorage.getItem('soc_store_v1'));if(s&&s.accounts){var a=s.accounts.find(function(x){return x.id===s.activeId;});if(a&&a.name)return a.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40);}}catch(e){}return 'guest';}
function _claimOK(){try{var s=JSON.parse(localStorage.getItem('soc_store_v1'));if(!s||!s.accounts||s.accounts.length<=1)return true;var a=s.accounts.find(function(x){return x.id===s.activeId;});return !!(a&&a.id===s.accounts[0].id);}catch(e){return true;}}
function acctSaveKey(base){var k=base+'__'+acctKey();try{if(!localStorage.getItem(k)&&localStorage.getItem(base+'__claimed')!=='1'){var old=localStorage.getItem(base);if(old&&_claimOK()){localStorage.setItem(k,old);localStorage.setItem(base+'__claimed','1');}}}catch(e){}return k;}
const SKEY=acctSaveKey('archerDuel_v1');
let best=(()=>{try{return(+JSON.parse(localStorage.getItem(SKEY)).best)||0;}catch(e){return 0;}})();
function saveBest(){try{localStorage.setItem(SKEY,JSON.stringify({best}));}catch(e){}}
const G=900;let groundY;resize();
const BODY=30,HEAD=60,FOE_BODY=15,FOE_HEAD=25,HEAL=22;
let state='menu',level,me,foes,pArrow,pReload,hearts,heartT,aim,parts,floats,shake,msg,msgT,leveling=false;
let tutMode=false,tutStep=0,tutPhase='brief',coachMsg='',tut={};

/* ---------- tutorial ---------- */
const TSTEPS=[
  { brief:"Hi! I'm your coach. Drag BACK from your archer and release to fire an arrow. Try to hit the rival!", act:true, hint:"fire & hit the rival", done:()=>tut.hit },
  { brief:"Nice! Hit the rival's BODY for damage — but hit the HEAD for a HEADSHOT (double damage!)." },
  { brief:"Hearts fall from the sky — shoot one with an arrow to heal up. Try it!", act:true, hint:"shoot the falling heart", done:()=>tut.heart, enter:()=>{ hearts.push({x:rand(X0+PW*0.4,X0+PW*0.7),y:-20,vy:34,r:16}); } },
  { brief:"In the real duel you AND your rival fire freely — after your arrow lands you can shoot again. Land more good shots to win each level. Tap to start!", end:true },
];
function startTut(){document.getElementById('ov').classList.add('hidden');document.getElementById('over').classList.add('hidden');state='play';tutMode=true;tutStep=0;tutPhase='brief';tut={};coachMsg='';
  level=1;me={x:X0+PW*0.12,y:groundY,hp:100,maxhp:100};foes=[{x:X0+PW*0.66,y:groundY,hp:100,maxhp:100,arrow:null,reload:0,acc:60,invuln:true}];
  pArrow=null;pReload=0;hearts=[];heartT=99;aim=null;parts=[];floats=[];shake=0;msg='';msgT=0;tutBrief();wakeLoop();}
function tutBrief(){tutPhase='brief';coachMsg=TSTEPS[tutStep].brief;}
function tutContinue(){if(tutPhase!=='brief')return;const s=TSTEPS[tutStep];if(s.end){tutFinish();return;}if(s.act){tutPhase='act';if(s.enter)s.enter();}else tutAdvance();}
function tutAdvance(){tutStep++;if(tutStep>=TSTEPS.length){tutFinish();return;}tutBrief();}
function tutTick(){if(tutPhase==='act'){const s=TSTEPS[tutStep];if(s.done&&s.done())tutAdvance();}}
function tutFinish(){tutMode=false;coachMsg='';state='menu';try{localStorage.setItem('archerTut','1');}catch(e){}
  document.getElementById('ovTag').textContent="You're ready. Tap Play to duel!";showMenu();}
function showMenu(){state='menu';document.getElementById('over').classList.add('hidden');
  document.getElementById('best').textContent=best?('Best: Level '+best):'Level 1 · vs rivals';
  document.getElementById('ov').classList.remove('hidden');}

/* ---------- levels ---------- */
function setupLevel(n){
  const baseX = X0 + Math.min(PW-60, PW*(0.46 + Math.min(0.42, n*0.075)));   // farther each level
  const two = n>=5;
  foes=[]; const acc=Math.max(10,130-n*13), reload=Math.max(0.9,2.3-n*0.16);
  if(two){ foes.push({x:Math.min(X0+PW-50,baseX-PW*0.06),y:groundY,hp:100,maxhp:100,arrow:null,reload:rand(.5,1.5),acc:acc+15,invuln:false});
           foes.push({x:Math.min(X0+PW-30,baseX+PW*0.05),y:groundY,hp:100,maxhp:100,arrow:null,reload:rand(1,2),acc:acc+15,invuln:false}); }
  else foes.push({x:baseX,y:groundY,hp:100,maxhp:100,arrow:null,reload:rand(1,2),acc,invuln:false});
  pArrow=null;pReload=0;hearts=[];heartT=rand(3,6);
  banner('LEVEL '+n+(two?'  •  2 RIVALS!':''));
}
function start(){document.getElementById('ov').classList.add('hidden');document.getElementById('over').classList.add('hidden');state='play';tutMode=false;
  level=1;me={x:X0+PW*0.12,y:groundY,hp:100,maxhp:100};parts=[];floats=[];shake=0;msg='';msgT=0;aim=null;leveling=false;setupLevel(1);wakeLoop();}
function gameOver(){state='over';if(level>best){best=level;saveBest();}
  try{if(window.IGAuth)IGAuth.submitScore('archer',best);}catch(e){}
  document.getElementById('overLv').textContent='Lv '+level;document.getElementById('overSub').textContent='A rival got you on level '+level+'.';
  document.getElementById('overBest').textContent=best;
  setTimeout(()=>{ if(state==='over')document.getElementById('over').classList.remove('hidden'); },600);}
function banner(t){msg=t;msgT=1.4;}
function flt(x,y,t,c){floats.push({x,y,t,c,life:1});}

/* ---------- firing ---------- */
function firePlayer(vx,vy){ pArrow={x:me.x,y:me.y-30,vx,vy}; sfx(420,.06,'triangle'); if(tutMode)tut.fired=true; }
function foeShoot(f){ const dx=me.x-f.x, dy=(me.y-28)-(f.y-30), t=1.0+Math.random()*0.2;
  const vx=dx/t+rand(-f.acc,f.acc), vy=(dy-0.5*G*t*t)/t+rand(-f.acc,f.acc); f.arrow={x:f.x,y:f.y-30,vx,vy}; }
function hitFoe(f,ax,ay){ if(Math.hypot(ax-f.x,ay-(f.y-42))<13){ // head
    if(!f.invuln)f.hp-=HEAD; flt(f.x,f.y-60,'HEADSHOT!','#ff5a5a'); boom(ax,ay,'#ff5a5a',18); shake=.45; sfx(160,.14,'square'); return true; }
  if(Math.hypot(ax-f.x,ay-(f.y-20))<20){ if(!f.invuln)f.hp-=BODY; flt(f.x,f.y-50,'-'+BODY,'#ffd54a'); boom(ax,ay,'#ffd54a',10); shake=.25; sfx(220,.1,'square'); return true; } return false; }
function hitMe(ax,ay){ if(Math.hypot(ax-me.x,ay-(me.y-42))<13){ me.hp-=FOE_HEAD; flt(me.x,me.y-60,'-'+FOE_HEAD,'#ff5a5a'); boom(ax,ay,'#ff8a8a',14); shake=.4; return true; }
  if(Math.hypot(ax-me.x,ay-(me.y-20))<20){ me.hp-=FOE_BODY; flt(me.x,me.y-50,'-'+FOE_BODY,'#ffb0b0'); boom(ax,ay,'#ffb0b0',8); shake=.2; return true; } return false; }
function boom(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-220,220),vy:rand(-300,40),life:.6,c});}

let last=0,rafId=null;
function loop(now){rafId=null;const dt=Math.min(.04,(now-last)/1000||0);last=now;
  if(shake>0)shake=Math.max(0,shake-dt*1.6);
  const sx=shake>0?(Math.random()*2-1)*shake*9:0,sy=shake>0?(Math.random()*2-1)*shake*9:0;ctx.setTransform(DPR,0,0,DPR,sx*DPR,sy*DPR);
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3a6b3a';ctx.fillRect(0,groundY,W,H-groundY);ctx.fillStyle='#2f5a2f';ctx.fillRect(0,groundY,W,6);
  if(X0>0){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,X0,H);ctx.fillRect(X0+PW,0,X0,H);ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(X0,0,2,H);ctx.fillRect(X0+PW-2,0,2,H);}
  if(state==='menu'||!me){ ctx.setTransform(DPR,0,0,DPR,0,0); return; }

  if(state==='play'){
    if(pReload>0)pReload-=dt;
    // hearts
    if(!tutMode){ heartT-=dt; if(heartT<=0){ heartT=rand(6,11); hearts.push({x:rand(X0+PW*0.3,X0+PW*0.85),y:-20,vy:rand(30,45),r:16}); } }
    for(const h of hearts){ h.y+=h.vy*dt; }
    hearts=hearts.filter(h=>h.y<H+30);
    // player arrow
    if(pArrow){ pArrow.vy+=G*dt; pArrow.x+=pArrow.vx*dt; pArrow.y+=pArrow.vy*dt;
      let done=false;
      for(const h of hearts){ if(Math.hypot(pArrow.x-h.x,pArrow.y-h.y)<h.r+5){ me.hp=Math.min(me.maxhp,me.hp+HEAL); flt(h.x,h.y-20,'+'+HEAL+' ❤️','#7dff9b'); boom(h.x,h.y,'#7dff9b',12); sfx(700,.1,'sine'); h.dead=true; done=true; if(tutMode)tut.heart=true; break; } }
      hearts=hearts.filter(h=>!h.dead);
      if(!done) for(const f of foes){ if(f.hp<=0)continue; if(hitFoe(f,pArrow.x,pArrow.y)){ if(tutMode)tut.hit=true; done=true; break; } }
      if(pArrow && (done || pArrow.y>groundY || pArrow.x<-30 || pArrow.x>W+30)){ if(!done&&pArrow.y>groundY)boom(pArrow.x,groundY,'#caa',5); pArrow=null; pReload=0.18; }
    }
    // foes
    if(!tutMode) for(const f of foes){ if(f.hp<=0)continue;
      if(!f.arrow){ f.reload-=dt; if(f.reload<=0){ f.reload=Math.max(0.9,2.3-level*0.16)+rand(0,0.8); foeShoot(f); } }
      else { f.arrow.vy+=G*dt; f.arrow.x+=f.arrow.vx*dt; f.arrow.y+=f.arrow.vy*dt;
        if(hitMe(f.arrow.x,f.arrow.y)){ f.arrow=null; if(me.hp<=0){ me.hp=0; gameOver(); } }
        else if(f.arrow.y>groundY||f.arrow.x<-30||f.arrow.x>W+30){ if(f.arrow.y>groundY)boom(f.arrow.x,groundY,'#caa',4); f.arrow=null; } } }
    // level clear
    if(!tutMode && !leveling && foes.length && foes.every(f=>f.hp<=0)){ leveling=true; level++; banner('LEVEL '+level+' CLEARED!'); for(let i=0;i<24;i++)parts.push({x:W/2,y:H*0.4,vx:rand(-260,260),vy:rand(-400,-40),life:1,c:'#ffd54a'}); foes.forEach(f=>{f.cleared=true;f.arrow=null;}); setTimeout(()=>{ if(state==='play')setupLevel(level); leveling=false; },1100); }
    if(tutMode)tutTick();
  }
  // draw archers
  drawArcher(me,'#3a86ff',1);
  for(const f of foes){ if(f.hp<=0&&!f.cleared)continue; if(f.hp>0)drawArcher(f,'#e0503a',-1); }
  // hearts
  for(const h of hearts){ ctx.font=(h.r*1.6)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('❤️',h.x,h.y); }
  // aim preview
  if(aim&&!pArrow&&pReload<=0&&state==='play'){ const vx=(me.x-aim.x)*4.2,vy=(me.y-30-aim.y)*4.2;
    ctx.fillStyle='rgba(255,255,255,.7)';let px=me.x,py=me.y-30,pvx=vx,pvy=vy;
    for(let i=0;i<26;i++){pvy+=G*0.04;px+=pvx*0.04;py+=pvy*0.04;if(py>groundY)break;if(i%2===0){ctx.beginPath();ctx.arc(px,py,3,0,6.28);ctx.fill();}}
    const p=Math.min(1,Math.hypot(me.x-aim.x,me.y-30-aim.y)/170);ctx.fillStyle=p>0.9?'#ff5a5a':'#ffd54a';ctx.fillRect(X0+20,H-28,200*p,10);ctx.strokeStyle='#fff';ctx.strokeRect(X0+20,H-28,200,10);}
  // arrows
  if(pArrow)drawArrow(pArrow);
  for(const f of foes)if(f.arrow)drawArrow(f.arrow);
  // particles & floats
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.life-=dt*1.5;}parts=parts.filter(p=>p.life>0);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);}ctx.globalAlpha=1;
  for(const f of floats){f.y-=40*dt;f.life-=dt;}floats=floats.filter(f=>f.life>0);
  for(const f of floats){ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle=f.c;ctx.font='900 20px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(f.t,f.x,f.y);ctx.globalAlpha=1;}
  // HUD
  if(state!=='menu'){ hpBar(X0+20,16,me.hp,me.maxhp,'#3a86ff','YOU');
    let fx=X0+PW-180; for(const f of foes){ if(f.hp>0){ hpBar(fx,16,f.hp,f.maxhp,'#e0503a','RIVAL'); fx-=Math.min(170,PW*0.42); } }
    ctx.fillStyle='#fff';ctx.font='700 14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText((tutMode?'Tutorial':'Level '+level)+'   •   best Lv '+best,W/2,20);}
  if(msgT>0){msgT-=dt;ctx.globalAlpha=Math.min(1,msgT);ctx.fillStyle='#ffd54a';ctx.font='900 30px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(msg,W/2,H*0.34);ctx.globalAlpha=1;}
  if(tutMode)drawCoach();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  /* park the loop while the scene is static (menu; settled game-over) to save battery */
  if(state==='play'||shake>0||msgT>0||(parts&&parts.length)||(floats&&floats.length))rafId=requestAnimationFrame(loop);
}
function wakeLoop(){if(rafId==null)rafId=requestAnimationFrame(loop);}
function drawArcher(s,col,face){const x=s.x,y=s.y;
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,y,18,6,0,0,6.28);ctx.fill();
  ctx.fillStyle=col;ctx.fillRect(x-10,y-34,20,32);                                   // body
  ctx.fillStyle='#f1c27d';ctx.beginPath();ctx.arc(x,y-44,11,0,6.28);ctx.fill();      // head
  ctx.fillStyle='#1a1a1a';ctx.fillRect(x-5,y-47,10,4);                                // hair
  ctx.strokeStyle='#6b4226';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+face*13,y-26,15,-1.1,1.1);ctx.stroke(); }
function drawArrow(a){const ang=Math.atan2(a.vy,a.vx);ctx.save();ctx.translate(a.x,a.y);ctx.rotate(ang);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(10,0);ctx.stroke();ctx.fillStyle='#ffd54a';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(2,-4);ctx.lineTo(2,4);ctx.fill();ctx.restore();}
function hpBar(x,y,hp,mx,col,lbl){ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(x,y,160,16);ctx.fillStyle=col;ctx.fillRect(x,y,160*Math.max(0,hp)/mx,16);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(x,y,160,16);ctx.fillStyle='#fff';ctx.font='700 11px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(lbl,x+2,y+27);}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawCoach(){if(!coachMsg)return;const maxw=Math.min(W*0.92,520),pad=14,x=W/2,tx0=x-maxw/2+pad+40;
  ctx.font='600 17px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
  const words=coachMsg.split(' ');const lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxw-pad*2-44&&line){lines.push(line);line=w;}else line=t;}if(line)lines.push(line);
  const extra=tutPhase==='brief'?'Tap or press any key to continue':('Your turn: '+(TSTEPS[tutStep].hint||'...'));
  const lh=23,bh=(lines.length+1)*lh+pad*2,by=Math.max(12,H*0.05),bx=x-maxw/2;
  ctx.save();ctx.shadowColor='rgba(20,20,60,.28)';ctx.shadowBlur=26;ctx.shadowOffsetY=8;ctx.fillStyle='rgba(255,255,255,.94)';rrect(bx,by,maxw,bh,20);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(0,0,0,.07)';ctx.lineWidth=1;rrect(bx,by,maxw,bh,20);ctx.stroke();
  {const ax=bx+26,ay=by+pad+13,g=ctx.createLinearGradient(ax-14,ay-14,ax+14,ay+14);g.addColorStop(0,'#9b7cf6');g.addColorStop(1,'#4d6bf0');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ax,ay,14,0,6.28);ctx.fill();
   ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ax,ay,8,0,6.28);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ax,ay,2.5,0,6.28);ctx.fill();}
  ctx.fillStyle='#1d1d1f';ctx.font='600 17px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],tx0,by+pad+i*lh);
  ctx.fillStyle='#4d6bf0';ctx.font='700 14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.fillText(extra,tx0,by+pad+lines.length*lh+2);}
let AC=null;function sfx(f,d,t){try{if(!AC)AC=new(AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d+.02);}catch(e){}}
cv.addEventListener('pointerdown',e=>{ if(tutMode&&tutPhase==='brief')return; if(state==='play'&&!pArrow&&pReload<=0)aim={x:e.clientX,y:e.clientY}; });
addEventListener('pointermove',e=>{if(aim)aim={x:e.clientX,y:e.clientY};});
addEventListener('pointerup',e=>{ if(tutMode&&tutPhase==='brief'){tutContinue();return;} if(!aim||pArrow||pReload>0){aim=null;return;} const vx=(me.x-aim.x)*4.2,vy=(me.y-30-aim.y)*4.2; if(Math.hypot(vx,vy)>40)firePlayer(vx,vy); aim=null; });
addEventListener('keydown',e=>{ if(tutMode&&tutPhase==='brief'){e.preventDefault();tutContinue();} });
document.getElementById('start').onclick=start;
document.getElementById('tutBtn').onclick=startTut;
document.getElementById('best').textContent=best?('Best: Level '+best):'Level 1 · vs rivals';
document.getElementById('again').onclick=start;
document.getElementById('overMenu').onclick=showMenu;
wakeLoop();
try{ if(!localStorage.getItem('archerTut')) startTut(); }catch(e){}
