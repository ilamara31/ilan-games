    <button class="ig-row" id="IGA_lb" onclick="window.IGAuth && IGAuth.showLeaderboard('football','Penalty Kings')"><span class="ig-tile" style="--tile:linear-gradient(160deg,#ffcf4a,#ff8a00)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 13v4M8.5 20h7M10 17h4"/></svg></span><span class="ig-grow">Leaderboard<small>Most tournament wins</small></span></button>

  </div>
  <div class="foot">ilan Games</div>
  <span id="IGA_login" hidden></span><!-- auth.js writes its plain label here; the row above shows the name -->
</div></div>
  <script src="../supabase-config.js"></script>
  <script src="../auth.js" defer></script>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    if(!window.IGAuth) return;
    function pkWins(){
      try{
        var s=JSON.parse(localStorage.getItem('soc_store_v1'));
        var a=(s&&Array.isArray(s.accounts))?s.accounts.find(function(x){return x.id===s.activeId;}):null;
        return (a&&a.pk)?(a.pk.won|0):0;
      }catch(e){ return 0; }
    }
    IGAuth.onChange(function(p){
      var b=document.getElementById('IGA_loginTxt'), s=document.getElementById('IGA_loginSub');
      if(b) b.textContent = p?IGAuth.displayName():'Log in';
      if(s) s.textContent = p?'Signed in · tap for account':'Save your wins to the leaderboard';
      IGAuth.submitScore('football', pkWins());
    });
  });
  </script>
  <script src="../analytics.js" defer></script>
  <script src="../announce.js" defer></script>
<script src="../friends.js" defer></script>
<script src="../rec.js" defer></script>
