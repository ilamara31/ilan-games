<style>

  /* menu / game-over overlay: ilan Games light glass page (gameplay canvas keeps its own look) */
  #ov{position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(242,242,247,.86);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);user-select:none}
  #ov::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;filter:blur(40px);
    background:radial-gradient(40vmax 40vmax at 15% 10%,rgba(245,175,25,.35),transparent 60%),radial-gradient(36vmax 36vmax at 90% 25%,rgba(241,39,17,.18),transparent 60%),radial-gradient(40vmax 40vmax at 60% 95%,rgba(10,132,255,.18),transparent 60%)}

<body>
<canvas id="g"></canvas>

<rect class="o" x="34" y="8" width="52" height="13" rx="2" fill="#ffcc00"/><rect x="37" y="10" width="46" height="3" rx="1.5" fill="#fff" opacity=".45"/>
<path d="M60 24 V33 M55 29 L60 34 L65 29" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M88 8 L92 4 M90 16 L96 16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<path d="M10 94 H90" stroke="#22120a" stroke-width="4" stroke-linecap="round"/></svg></div>
      <h1 class="ig-title" id="ovTitle">Stack Tower</h1>
      <div class="ig-tagline sub" id="ovSub">Drop each block right on top. Perfect stacks keep full width and build a combo.</div>
    </div>

    <div class="ig-playrow">
      <button class="ig-cta" id="start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg><span><b id="startLbl">Play</b><small id="startSub">Tap or press Space to drop</small></span></button>
    </div>
    <div class="ig-list">
      <a class="ig-row" id="tutBtn"><span class="ig-tile" style="--tile:linear-gradient(160deg,#5ac8fa,#0a60ff)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v17H6.5A2.5 2.5 0 0 0 4 22.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v17h5.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg></span><span class="ig-grow">Tutorial<small>Learn in 3 blocks</small></span></a>
      <a class="ig-row" onclick="window.IGAuth&&IGAuth.showLeaderboard('stack','Stack Tower')"><span class="ig-tile" style="--tile:linear-gradient(160deg,#ffcf4a,#ff8a00)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg></span><span class="ig-grow">Leaderboard<small>Tallest towers</small></span></a>
      <a class="ig-row" onclick="window.IGAuth&&IGAuth.openAuth()"><span class="ig-tile" style="--tile:linear-gradient(160deg,#5ee28a,#11998e)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"/></svg></span><span class="ig-grow"><span id="igaName">Log in</span><small>Save your best score</small></span></a>
    </div>
  </div>
</div>
<script>
"use strict";
const cv=document.getElementById('g'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1,PW=0,X0=0;
/* PW/X0: logical playfield band, capped at phone-ish width so the block's travel
   range feels the same on desktop as on mobile; X0 centres the band on screen. */
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);PW=Math.min(W,480);X0=(W-PW)/2;}
addEventListener('resize',()=>{resize();wakeLoop();});resize();
/* per-account save: each logged-in account keeps its own progress.
   The device's existing save is inherited once, by the primary (first) account. */
function acctKey(){try{var p=JSON.parse(localStorage.getItem('ig_player'));if(p&&p.name)return p.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40);}catch(e){}try{var s=JSON.parse(localStorage.getItem('soc_store_v1'));if(s&&s.accounts){var a=s.accounts.find(function(x){return x.id===s.activeId;});if(a&&a.name)return a.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40);}}catch(e){}return 'guest';}
function _claimOK(){try{var s=JSON.parse(localStorage.getItem('soc_store_v1'));if(!s||!s.accounts||s.accounts.length<=1)return true;var a=s.accounts.find(function(x){return x.id===s.activeId;});return !!(a&&a.id===s.accounts[0].id);}catch(e){return true;}}
function acctSaveKey(base){var k=base+'__'+acctKey();try{if(!localStorage.getItem(k)&&localStorage.getItem(base+'__claimed')!=='1'){var old=localStorage.getItem(base);if(old&&_claimOK()){localStorage.setItem(k,old);localStorage.setItem(base+'__claimed','1');}}}catch(e){}return k;}
const SKEY=acctSaveKey('stackTower_v1');
let best=(()=>{try{return(+JSON.parse(localStorage.getItem(SKEY)).best)||0;}catch(e){return 0;}})();
function saveBest(){try{localStorage.setItem(SKEY,JSON.stringify({best}));}catch(e){}}
const BH=34;
let state='menu',stack,cur,camY,score,combo,parts=[],speed,shake,flash;
let tutMode=false,tutCount=0,coachMsg='';
function hue(i){return (i*9+200)%360;}
function startTut(){document.getElementById('ov').classList.add('hidden');state='play';tutMode=true;tutCount=0;
  const w=Math.min(PW*0.5,260);stack=[{x:W/2-w/2,w,y:0}];score=0;combo=0;camY=0;speed=2.6;parts=[];shake=0;flash=0;
  coachMsg='Tap / SPACE to drop the block right over the one below. Line up 3 to finish!';spawn();wakeLoop();}
function tutFinish(){tutMode=false;coachMsg='';state='menu';try{localStorage.setItem('stackTut','1');}catch(e){}
  const ov=document.getElementById('ov');ov.querySelector('h1').textContent='Stack Tower';ov.querySelector('.sub').innerHTML="You're ready! Press Play to build your tower.";document.getElementById('startLbl').textContent='Play';ov.querySelector('#best').innerHTML=bestHTML();ov.classList.remove('hidden');}
function bestHTML(){return best?('<div class="ig-stats"><div><b>'+best+'</b><span>Best tower</span></div></div>'):'';}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawCoach(){if(!coachMsg)return;const maxw=Math.min(W*0.92,520),pad=16,x=W/2,tx0=x-maxw/2+pad+40;
  const CF='600 17px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.font=CF;ctx.textAlign='left';ctx.textBaseline='top';
  const words=coachMsg.split(' ');const lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxw-pad*2-44&&line){lines.push(line);line=w;}else line=t;}if(line)lines.push(line);
  const lh=23,bh=lines.length*lh+pad*2,by=Math.max(12,H*0.06),bx=x-maxw/2;
  ctx.save();ctx.shadowColor='rgba(20,20,50,.28)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;ctx.fillStyle='rgba(255,255,255,.94)';rrect(bx,by,maxw,bh,22);ctx.fill();ctx.restore();
  const g=ctx.createLinearGradient(bx+12,by+pad,bx+44,by+pad+32);g.addColorStop(0,'#f5af19');g.addColorStop(1,'#f12711');ctx.fillStyle=g;rrect(bx+12,by+pad-2,30,30,9);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx+27,by+pad+4);ctx.lineTo(bx+27,by+pad+20);ctx.moveTo(bx+21,by+pad+14);ctx.lineTo(bx+27,by+pad+20);ctx.lineTo(bx+33,by+pad+14);ctx.stroke();
  ctx.fillStyle='#1d1d1f';ctx.font=CF;for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],tx0,by+pad+i*lh);}
function start(){document.getElementById('ov').classList.add('hidden');state='play';
  const w=Math.min(PW*0.5,260);stack=[{x:W/2-w/2,w,y:0}];score=0;combo=0;camY=0;speed=3.0;parts=[];shake=0;flash=0;spawn();wakeLoop();}
function spawn(){const top=stack[stack.length-1];cur={x:0,w:top.w,y:(stack.length)*BH,dir:1};speed=3.0+score*0.06;}
function drop(){const top=stack[stack.length-1];const L=Math.max(cur.x,top.x),R=Math.min(cur.x+cur.w,top.x+top.w),ov=R-L;
  if(ov<=0){ // miss
    parts.push({x:cur.x,y:cur.y,w:cur.w,vy:0,vx:cur.dir*40,life:1.4,c:'hsl('+hue(stack.length)+',70%,60%)'});
    if(tutMode){ coachMsg='Oops! Drop it right OVER the block below — try again.'; spawn(); return; }
    gameOver();return;}
  const off=Math.abs(cur.x-top.x);
  if(off<7){ // perfect
    combo++;score++;flash=.4;sfx(500+Math.min(12,combo)*60,.07,'square');
    const nw=Math.min(top.w+ (combo>=3?6:0), PW*0.6);const nx=top.x-(nw-top.w)/2;
    stack.push({x:nx,w:nw,y:cur.y});
    parts.push({x:cur.x,y:cur.y,w:cur.w,perfect:true,life:.5});
  } else { combo=0;score++;sfx(320,.06,'sine');
    // slice overhang
    if(cur.x<top.x){ parts.push({x:cur.x,y:cur.y,w:top.x-cur.x,vx:-60,vy:0,life:1.4,c:'hsl('+hue(stack.length)+',70%,60%)'}); }
    else { parts.push({x:R,y:cur.y,w:(cur.x+cur.w)-R,vx:60,vy:0,life:1.4,c:'hsl('+hue(stack.length)+',70%,60%)'}); }
    stack.push({x:L,w:ov,y:cur.y});
  }
  spawn();
  if(tutMode){ tutCount++; coachMsg='Nice! '+tutCount+' / 3 — keep stacking!'; if(tutCount>=3){ coachMsg='Perfect — you’re ready!'; setTimeout(tutFinish,700); } }
}
function gameOver(){if(tutMode)return;state='over';if(score>best){best=score;saveBest();}try{if(window.IGAuth)IGAuth.submitScore('stack',best);}catch(e){}shake=.5;
  const ov=document.getElementById('ov');ov.querySelector('h1').textContent='Toppled!';ov.querySelector('.sub').innerHTML='You missed the stack.';
  document.getElementById('startLbl').textContent='Play again';ov.querySelector('#best').innerHTML='<div class="big">'+score+'</div><div class="bl">blocks stacked · Best '+best+'</div>';
  setTimeout(()=>ov.classList.remove('hidden'),650);}
let last=0,rafId=null;
function loop(now){rafId=null;const dt=Math.min(.04,(now-last)/1000||0);last=now;
  if(shake>0)shake=Math.max(0,shake-dt*1.5);if(flash>0)flash=Math.max(0,flash-dt*2.5);
  const sx=shake>0?(Math.random()*2-1)*shake*10:0,sy=shake>0?(Math.random()*2-1)*shake*10:0;ctx.setTransform(DPR,0,0,DPR,sx*DPR,sy*DPR);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#10204a');bg.addColorStop(1,'#0a0f24');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(X0>0){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,X0,H);ctx.fillRect(X0+PW,0,X0,H);ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(X0,0,2,H);ctx.fillRect(X0+PW-2,0,2,H);}
  if(state==='play'){ cur.x+=cur.dir*speed*60*dt; if(cur.x<X0+10){cur.x=X0+10;cur.dir=1;} if(cur.x+cur.w>X0+PW-10){cur.x=X0+PW-10-cur.w;cur.dir=-1;} }
  const targetCam=stack?Math.max(0,(stack.length)*BH - H*0.55):0;camY+=(targetCam-camY)*Math.min(1,dt*6);
  function sy2(y){return H-60 - (y-camY);}
  if(stack)for(let i=0;i<stack.length;i++){const b=stack[i];const yy=sy2(b.y);if(yy>H+40||yy<-40)continue;
    ctx.fillStyle='hsl('+hue(i)+',62%,58%)';ctx.fillRect(b.x,yy-BH,b.w,BH);ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(b.x,yy-BH,b.w,4);ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(b.x,yy-5,b.w,5);}
  if(state==='play'){const yy=sy2(cur.y);ctx.fillStyle='hsl('+hue(stack.length)+',70%,62%)';ctx.fillRect(cur.x,yy-BH,cur.w,BH);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(cur.x,yy-BH,cur.w,4);}
  for(const p of parts){ if(p.perfect){p.life-=dt;continue;} p.x+=(p.vx||0)*dt;p.vy=(p.vy||0)+900*dt;p.y-=0;p.fall=(p.fall||0)+p.vy*dt;p.life-=dt; const yy=sy2(p.y)+(p.fall||0);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,yy-BH,p.w,BH);ctx.globalAlpha=1;}
  parts=parts.filter(p=>p.life>0);
  // perfect flashes
  for(const p of parts){if(p.perfect){const yy=sy2(p.y);ctx.globalAlpha=Math.max(0,p.life*2);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(stack[stack.length-1].x-4,yy-BH-4,stack[stack.length-1].w+8,BH+8);ctx.globalAlpha=1;}}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(state!=='menu'){ctx.fillStyle='#fff';ctx.font='900 60px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.textAlign='center';ctx.globalAlpha=.9;ctx.fillText(score,W/2,90);ctx.globalAlpha=1;
    if(combo>=2){ctx.fillStyle='#ffd54a';ctx.font='900 22px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.fillText('PERFECT x'+combo+'!',W/2,120);}
    ctx.font='600 14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif';ctx.fillStyle='#c7d2f0';ctx.fillText('best '+best,W/2,H-16);}
  if(tutMode)drawCoach();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*0.25+')';ctx.fillRect(0,0,W,H);}
  /* park the loop when the scene is static (menu / settled game-over) to save battery */
  if(state==='play'||shake>0||flash>0||(parts&&parts.length)||(stack&&Math.abs(targetCam-camY)>0.5))rafId=requestAnimationFrame(loop);
}
function wakeLoop(){if(rafId==null)rafId=requestAnimationFrame(loop);}
let AC=null;function sfx(f,d,t){try{if(!AC)AC=new(AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d+.02);}catch(e){}}
function act(){if(state==='play')drop();}
addEventListener('pointerdown',()=>{if(state==='play')act();});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();act();}});
document.getElementById('start').onclick=start;
document.getElementById('tutBtn').onclick=startTut;
document.getElementById('best').innerHTML=bestHTML();
wakeLoop();
try{ if(!localStorage.getItem('stackTut')) startTut(); }catch(e){}
</script>
<script src="../supabase-config.js"></script>
<script src="../auth.js" defer></script>
<script>document.addEventListener('DOMContentLoaded',function(){ if(!window.IGAuth)return;
  IGAuth.onChange(function(p){ var b=document.getElementById('igaName'); if(b)b.textContent=p?IGAuth.displayName():'Log in';
    try{ var s=JSON.parse(localStorage.getItem(SKEY)); if(s&&+s.best>0) IGAuth.submitScore('stack',+s.best); }catch(e){} }); });</script>
<script src="../analytics.js" defer></script>
<script src="../announce.js" defer></script>
<script src="../friends.js" defer></script>
<script src="../rec.js" defer></script>
</body></html>
